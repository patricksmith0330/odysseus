name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] credentials are required for the push below
        with:
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Merge upstream release branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/odysseus-dev/odysseus.git
          git fetch --prune upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
          else
            git merge --no-edit upstream/main
          fi

          git push origin HEAD:main
          gh workflow run docker-publish.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
